name: Build LottoQuant Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5 (Compatible with Flet 0.25.2)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2
          pip install -r requirements.txt

      - name: Build Android APK via Flet
        run: |
          flet build apk . \
            --project LottoQuantPro \
            --org com.lottoquant.pro \
            --product "LottoQuant Pro" \
            --build-version 1.0.2 \
            --build-number 2 \
            --no-rich-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LottoQuantPro-Android-APK
          path: build/apk/*.apk
          retention-days: 30
